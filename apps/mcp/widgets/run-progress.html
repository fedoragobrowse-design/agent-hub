<!doctype html>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark" />
<style>
  :root {
    --ink: var(--color-text-primary, #202b43);
    --sub: var(--color-text-secondary, #5a6270);
    --line: var(--color-border-default, #dbe2ef);
    --panel: var(--color-surface-primary, #fbfcff);
  }
  html, body { background: transparent; color: var(--ink); }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; }
  .card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .fill { height: 100%; background: #3157b7; transition: width 200ms; }
  .state { font-weight: 600; }
  .sub { color: var(--sub); font-size: 12px; }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
  ul { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: var(--sub); max-height: 160px; overflow-y: auto; }
</style>
<div class="card">
  <p><span class="state" id="state">Run</span> <span class="sub" id="meta"></span></p>
  <div class="bar"><div id="fill" class="fill" style="width:5%"></div></div>
  <ul id="events"></ul>
</div>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App, applyHostStyleVariables } = globalThis.ExtApps;
(async () => {
  const app = new App({ name: "RunProgress", version: "1.0.0" }, { autoResize: true });

  function applyHostContext(ctx) {
    document.documentElement.classList.toggle("dark", ctx?.theme === "dark");
    if (ctx?.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
  }
  app.onhostcontextchanged = applyHostContext;

  const order = { queued: 10, preparing: 30, running: 60, awaiting_approval: 75, succeeded: 100, failed: 100, cancelled: 100 };
  app.ontoolresult = ({ content }) => {
    const payload = JSON.parse(content[0].text);
    const run = payload.run ?? payload;
    const latest = payload.events ?? [];
    document.getElementById("state").textContent = `Run ${run.state}`;
    document.getElementById("meta").textContent = `${run.id} · ${run.request.harness} · ${run.request.target}`;
    document.getElementById("fill").style.width = `${order[run.state] ?? 50}%`;
    const list = document.getElementById("events");
    list.innerHTML = "";
    for (const e of latest.slice(-6)) {
      const li = document.createElement("li");
      li.textContent = `[${e.type}] ${e.message}`;
      list.append(li);
    }
  };

  await app.connect();
  applyHostContext(app.getHostContext());
})();
</script>

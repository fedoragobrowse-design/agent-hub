  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="200" ry="185" fill="url(#glow)"/>
  <g filter="url(#soft)" fill="url(#pink)">
    <rect x="132" y="136" width="248" height="50" rx="6"/>
    <rect x="150" y="186" width="58" height="192" rx="6"/>
    <rect x="304" y="186" width="58" height="132" rx="6"/>
    <rect x="295" y="318" width="76" height="30" rx="10"/>
